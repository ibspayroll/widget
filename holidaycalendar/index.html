<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>IBS Holiday Calendar</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      color: #0B2A49;
      box-sizing: border-box;
      overflow: hidden;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .calendar-page {
      width: 100%;
      height: 100%;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      background: transparent;
    }

    .calendar-link {
      display: block;
      width: 100%;
      max-width: 780px;
      text-align: center;
      text-decoration: none;
    }

    .calendar-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      object-fit: contain;
      margin: 0 auto;
      border: 0;
    }

    .calendar-caption {
      margin-top: 8px;
      font-size: 12.5px;
      line-height: 1.3;
      color: #0073c8;
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="calendar-page">

    <a
      class="calendar-link"
      href="https://workdrive.zohoexternal.com/embed/pnhs7d5feb4521ce440d1822fe86687dd0302?toolbar=true&amp;appearance=light&amp;themecolor=green"
      target="_blank"
      rel="noopener noreferrer">

      <img
        class="calendar-image"
        src="calendar.png"
        alt="IBS and Bank Holiday Calendar">

      <div class="calendar-caption">
        Click to open or download the IBS Holiday Calendar
      </div>

    </a>

  </div>

</body>
</html>
