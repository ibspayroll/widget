<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>IBS Holiday Calendar</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      color: #0B2A49;
      box-sizing: border-box;
      overflow: hidden;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .calendar-page {
      width: 100%;
      height: 100%;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      background: transparent;
    }

    .calendar-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      width: 100%;
      max-width: 980px;
      text-decoration: none;
    }

    .calendar-image {
      display: block;
      width: 100%;
      max-width: 720px;
      height: auto;
      max-height: 470px;
      object-fit: contain;
      border: 0;
    }

    .download-text {
      flex: 0 0 auto;
      min-width: 150px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #0073c8;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
      text-align: center;
      text-decoration: underline;
      box-shadow: 0 1px 3px rgba(11, 42, 73, 0.06);
    }

    .download-subtext {
      display: block;
      margin-top: 3px;
      color: #4b5563;
      font-size: 11.5px;
      font-weight: 400;
      text-decoration: none;
    }

    @media (max-width: 760px) {
      .calendar-page {
        align-items: flex-start;
        padding: 10px 12px;
      }

      .calendar-link {
        flex-direction: column;
        gap: 8px;
      }

      .calendar-image {
        max-width: 100%;
        max-height: 420px;
      }

      .download-text {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="calendar-page">

    <a
      class="calendar-link"
      href="https://workdrive.zohoexternal.com/embed/pnhs7d5feb4521ce440d1822fe86687dd0302?toolbar=true&amp;appearance=light&amp;themecolor=green"
      target="_blank"
      rel="noopener noreferrer">

      <img
        class="calendar-image"
        src="calendar.png"
        alt="IBS and Bank Holiday Calendar">

      <span class="download-text">
        Open / Download Calendar
        <span class="download-subtext">PDF opens in a new tab</span>
      </span>

    </a>

  </div>

</body>
</html>
