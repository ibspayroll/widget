<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>IBS Holiday Calendar</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      color: #0B2A49;
      box-sizing: border-box;
      overflow: hidden;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .calendar-page {
      width: 100%;
      height: 100%;
      min-height: 430px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      background: transparent;
    }

    .calendar-layout {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .calendar-image-link {
      display: block;
      width: 100%;
      max-width: 620px;
      text-decoration: none;
    }

    .calendar-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      border: 0;
    }

    .download-text {
      flex: 0 0 auto;
      min-width: 180px;
      text-align: center;
      color: #0073c8;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
      text-decoration: underline;
    }

    .download-subtext {
      display: block;
      margin-top: 4px;
      color: #4b5563;
      font-size: 11.5px;
      font-weight: 400;
      text-decoration: none;
    }

    a:hover {
      color: #F47421;
    }

    @media (max-width: 900px) {
      .calendar-page {
        align-items: flex-start;
        padding: 10px 12px;
      }

      .calendar-layout {
        flex-direction: column;
        gap: 10px;
      }

      .calendar-image-link {
        max-width: 100%;
      }

      .download-text {
        min-width: 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="calendar-page">

    <div class="calendar-layout">

      <a
        class="calendar-image-link"
        href="https://workdrive.zohoexternal.com/embed/pnhs7d5feb4521ce440d1822fe86687dd0302?toolbar=true&amp;appearance=light&amp;themecolor=green"
        target="_blank"
        rel="noopener noreferrer">

        <img
          class="calendar-image"
          src="calendar.png"
          alt="IBS and Bank Holiday Calendar">
      </a>

      <a
        class="download-text"
        href="https://workdrive.zohoexternal.com/embed/pnhs7d5feb4521ce440d1822fe86687dd0302?toolbar=true&amp;appearance=light&amp;themecolor=green"
        target="_blank"
        rel="noopener noreferrer">
        Open / Download Calendar
      </a>

    </div>

  </div>

</body>
</html>
