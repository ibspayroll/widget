<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>IBS Reminders</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      color: #0B2A49;
      box-sizing: border-box;
      overflow: hidden;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .reminder-page {
      width: 100%;
      min-height: 500px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 36px 28px 0 28px;
      background: transparent;
      text-align: center;
    }

    .reminder-content {
      width: 100%;
      max-width: 980px;
    }

    .eyebrow {
      margin: 0 0 8px 0;
      color: #F47421;
      font-size: 13px;
      line-height: 1.25;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .reminder-title {
      margin: 0 0 8px 0;
      color: #0B2A49;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
    }

    .reminder-text {
      margin: 0 0 16px 0;
      color: #374151;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 600;
    }

    .reminder-actions {
      margin: 0 0 12px 0;
    }

    .reminder-button {
      display: inline-block;
      margin: 0 5px 7px 5px;
      padding: 10px 16px;
      border-radius: 6px;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
    }

    .button-orange {
      background: #F47421;
    }

    .button-blue {
      background: #0B2A49;
    }

    .reminder-button:hover {
      opacity: 0.9;
    }

    .reminder-date {
      margin: 0;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.3;
    }

    @media (max-width: 650px) {
      .reminder-page {
        min-height: 500px;
        padding: 24px 16px 0 16px;
      }

      .reminder-title {
        font-size: 19px;
      }

      .reminder-text {
        font-size: 14px;
      }

      .reminder-button {
        display: block;
        width: 100%;
        margin: 0 0 7px 0;
      }
    }
  </style>
</head>

<body>

  <div class="reminder-page">
    <div class="reminder-content">

      <p class="eyebrow">Latest Announcement</p>

      <p class="reminder-title">
        OBBBA Earning Code Is Now Available
      </p>

      <p class="reminder-text">
        Please review the latest "No Tax on Overtime" resources.
      </p>

      <div class="reminder-actions">
        <a
          class="reminder-button button-orange"
          href="https://files.constantcontact.com/c4c8f1e5701/50d2ea8f-093e-48dc-a0ac-2d8b20f6f726.pdf"
          target="_blank"
          rel="noopener noreferrer">
          View OBBBA PDF
        </a>

        <a
          class="reminder-button button-blue"
          href="https://youtu.be/PsbFJFyJ8ow"
          target="_blank"
          rel="noopener noreferrer">
          Watch Video Overview
        </a>
      </div>

      <p class="reminder-date">
        Last updated: March 30, 2026
      </p>

    </div>
  </div>

</body>
</html>
