<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>IBS Announcement</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      color: #0B2A49;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .announcement-wrapper {
      width: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      text-align: center;
    }

    .announcement-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 100%;
      margin: 0 auto;
      padding: 8px 12px;
      background: #fff7f0;
      border: 1px solid #f7c49f;
      border-left: 5px solid #F47421;
      text-align: left;
      vertical-align: top;
    }

    .announcement-title {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.35;
      font-weight: 700;
      color: #0B2A49;
    }

    .announcement-title .highlight {
      color: #F47421;
    }

    .announcement-actions {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 6px;
      flex-shrink: 0;
    }

    .announcement-button {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 4px;
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
    }

    .button-orange {
      background: #F47421;
    }

    .button-blue {
      background: #0B2A49;
    }

    .announcement-button:hover {
      opacity: 0.9;
    }

    @media (max-width: 650px) {
      .announcement-card {
        display: flex;
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="announcement-wrapper">
    <div class="announcement-card">

      <p class="announcement-title">
        <span class="highlight">OBBBA Earning Code Is Now Available.</span>
        Review the latest "No Tax on Overtime" resources.
      </p>

      <div class="announcement-actions">
        <a
          class="announcement-button button-orange"
          href="https://files.constantcontact.com/c4c8f1e5701/50d2ea8f-093e-48dc-a0ac-2d8b20f6f726.pdf"
          target="_blank"
          rel="noopener noreferrer">
          View OBBBA PDF
        </a>

        <a
          class="announcement-button button-blue"
          href="https://youtu.be/PsbFJFyJ8ow"
          target="_blank"
          rel="noopener noreferrer">
          Watch Video
        </a>
      </div>

    </div>
  </div>

</body>
</html>
