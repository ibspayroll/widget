<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>IBS Reminders</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      color: #0B2A49;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .reminder-page {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .reminder-card {
      width: 92%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 14px;
      background: #fff7f0;
      border: 1px solid #f7c49f;
      border-left: 5px solid #F47421;
    }

    .reminder-title {
      margin: 0 0 8px 0;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      color: #0B2A49;
    }

    .reminder-title .highlight {
      color: #F47421;
    }

    .reminder-actions {
      margin: 0 0 8px 0;
    }

    .reminder-button {
      display: inline-block;
      margin: 0 6px 4px 0;
      padding: 7px 11px;
      border-radius: 4px;
      color: #ffffff;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 700;
      white-space: nowrap;
    }

    .button-orange {
      background: #F47421;
    }

    .button-blue {
      background: #0B2A49;
    }

    .reminder-date {
      margin: 0;
      color: #777777;
      font-size: 12px;
      line-height: 1.3;
    }

    @media (max-width: 650px) {
      .reminder-card {
        width: 100%;
        padding: 11px 12px;
      }

      .reminder-title {
        font-size: 14px;
      }

      .reminder-button {
        font-size: 12.5px;
        padding: 7px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="reminder-page">

    <div class="reminder-card">

      <p class="reminder-title">
        <span class="highlight">OBBBA Earning Code Is Now Available.</span>
        Please review the latest "No Tax on Overtime" resources.
      </p>

      <div class="reminder-actions">
        <a
          class="reminder-button button-orange"
          href="https://files.constantcontact.com/c4c8f1e5701/50d2ea8f-093e-48dc-a0ac-2d8b20f6f726.pdf"
          target="_blank"
          rel="noopener noreferrer">
          View OBBBA PDF
        </a>

        <a
          class="reminder-button button-blue"
          href="https://youtu.be/PsbFJFyJ8ow"
          target="_blank"
          rel="noopener noreferrer">
          Watch Video Overview
        </a>
      </div>

      <p class="reminder-date">
        Last updated: March 30, 2026
      </p>

    </div>

  </div>

</body>
</html>
